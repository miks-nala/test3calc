<!DOCTYPE html>
<html>
    <title>
        Calculator
    </title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <script src="calculator.js"></script>

    <input class="result" type="text" id="display" placeholder="0" readonly>
    <br>
    <button class="num1" type="button" onclick="addValue('1')">1 </button>
    <button class="num2" type="button" onclick="addValue('2')">2 </button>
    <button class="num3" type="button" onclick="addValue('3')">3 </button>
    <button class="num4" type="button" onclick="addValue('4')">4 </button>
    <button class="num5" type="button" onclick="addValue('5')">5 </button>
    <button class="num6" type="button" onclick="addValue('6')">6 </button>
    <button class="num7" type="button" onclick="addValue('7')">7 </button>
    <button class="num8" type="button" onclick="addValue('8')">8 </button>
    <button class="num9" type="button" onclick="addValue('9')">9 </button>
    <button class="num0" type="button" onclick="addValue('0')">0 </button>
    <button class="decimal" type="button" onclick="addDec()">. </button>

    <button class="opEquals" onclick="equal()">= </button>
    <button class="opAdd" onclick="add()">+ </button>
    <button class="opSubtract" onclick="sub()">- </button>
    <button class="opMultiply" onclick="mul()">*</button>
    <button class="opDivide" onclick="div()">/ </button>

    <button class="opDelete" onclick="deleteValue()">⬅ </button>
    <button class="opClearAll" onclick="clearAllValue()">C </button>




</html> 























</html>
